# Creative Commerce Studio — App Builder backend (headless: actions only).
# Values come from .env at deploy time (see .env.example). `final: true` stops
# request parameters from overriding these inputs.
application:
  runtimeManifest:
    packages:
      creative-commerce-studio:
        license: Apache-2.0
        inputs:
          LOG_LEVEL: info
          ALLOWED_ORIGINS: $ALLOWED_ORIGINS
          IMS_ALLOWED_CLIENT_IDS: $IMS_ALLOWED_CLIENT_IDS
          IMS_ALLOWED_ORGS: $IMS_ALLOWED_ORGS
          TOKEN_ENCRYPTION_KEY: $TOKEN_ENCRYPTION_KEY
          BOX_CLIENT_ID: $BOX_CLIENT_ID
          BOX_CLIENT_SECRET: $BOX_CLIENT_SECRET
          BOX_REDIRECT_URI: $BOX_REDIRECT_URI
          BOX_ALLOWED_FOLDER_ID: $BOX_ALLOWED_FOLDER_ID
          GDRIVE_CLIENT_ID: $GDRIVE_CLIENT_ID
          GDRIVE_CLIENT_SECRET: $GDRIVE_CLIENT_SECRET
          GDRIVE_REDIRECT_URI: $GDRIVE_REDIRECT_URI
          GDRIVE_ALLOWED_FOLDER_ID: $GDRIVE_ALLOWED_FOLDER_ID
          FFCPE_MODE: $FFCPE_MODE
          BRIDGE_TOKEN: $BRIDGE_TOKEN
          FFCPE_MCP_URL: $FFCPE_MCP_URL
          FIREFLY_REDIRECT_URI: $FIREFLY_REDIRECT_URI
          FIREFLY_CLIENT_NAME: $FIREFLY_CLIENT_NAME
          FIREFLY_SCOPE: $FIREFLY_SCOPE
          FFCPE_TOOL_SUBMIT: $FFCPE_TOOL_SUBMIT
          FFCPE_TOOL_STATUS: $FFCPE_TOOL_STATUS
          FFCPE_PRODUCT_NODE_ID: $FFCPE_PRODUCT_NODE_ID
          FFCPE_DESKTOP_NODE_ID: $FFCPE_DESKTOP_NODE_ID
          FFCPE_MOBILE_NODE_ID: $FFCPE_MOBILE_NODE_ID
          FFCPE_API_BASE: $FFCPE_API_BASE
          FFCPE_IMS_ORG_ID: $FFCPE_IMS_ORG_ID
          FFCPE_IMS_USER_ID: $FFCPE_IMS_USER_ID
          FFCPE_WORKFLOW_ID: $FFCPE_WORKFLOW_ID
          FFCPE_RECIPE_VERSION: $FFCPE_RECIPE_VERSION
          FFCPE_CLIENT_ID: $FFCPE_CLIENT_ID
          FFCPE_CLIENT_SECRET: $FFCPE_CLIENT_SECRET
          FFCPE_SCOPES: $FFCPE_SCOPES
          FFCPE_EXECUTE_TEMPLATE: $FFCPE_EXECUTE_TEMPLATE
          DELIVERY_MODE: $DELIVERY_MODE
          AEM_AUTHOR_URL: $AEM_AUTHOR_URL
          AEM_DELIVERY_URL: $AEM_DELIVERY_URL
          AEM_CLIENT_ID: $AEM_CLIENT_ID
          AEM_CLIENT_SECRET: $AEM_CLIENT_SECRET
          AEM_SCOPES: $AEM_SCOPES
          AEM_TARGET_FOLDER: $AEM_TARGET_FOLDER
        actions:
          box-status:
            function: actions/box-status/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations: &web
              final: true
              web-custom-options: true
              require-adobe-auth: false
          box-auth-start:
            function: actions/box-auth-start/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations: *web
          box-auth-callback:
            function: actions/box-auth-callback/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations: *web
          box-files:
            function: actions/box-files/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations: *web
          box-disconnect:
            function: actions/box-disconnect/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations: *web
          sources-status:
            function: actions/sources-status/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations: *web
          gdrive-status:
            function: actions/gdrive-status/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations: *web
          gdrive-auth-start:
            function: actions/gdrive-auth-start/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations: *web
          gdrive-auth-callback:
            function: actions/gdrive-auth-callback/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations: *web
          gdrive-files:
            function: actions/gdrive-files/index.js
            web: 'yes'
            runtime: nodejs:22
            limits:
              timeout: 120000
            annotations: *web
          gdrive-disconnect:
            function: actions/gdrive-disconnect/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations: *web
          firefly-status:
            function: actions/firefly-status/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations: *web
          firefly-auth-start:
            function: actions/firefly-auth-start/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations: *web
          firefly-auth-callback:
            function: actions/firefly-auth-callback/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations: *web
          firefly-disconnect:
            function: actions/firefly-disconnect/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations: *web
          bridge-next:
            function: actions/bridge-next/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations: *web
          bridge-report:
            function: actions/bridge-report/index.js
            web: 'yes'
            runtime: nodejs:22
            limits:
              timeout: 120000
              memorySize: 512
            annotations: *web
          job-submit:
            function: actions/job-submit/index.js
            web: 'yes'
            runtime: nodejs:22
            limits:
              timeout: 120000
              memorySize: 512
            annotations: *web
          job-status:
            function: actions/job-status/index.js
            web: 'yes'
            runtime: nodejs:22
            limits:
              timeout: 120000
              memorySize: 512
            annotations: *web
          job-accept:
            function: actions/job-accept/index.js
            web: 'yes'
            runtime: nodejs:22
            limits:
              timeout: 180000
              memorySize: 512
            annotations: *web
          job-recent:
            function: actions/job-recent/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations: *web
